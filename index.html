  <meta name="apple-mobile-web-app-capable" content="yes" />

<body>
  <a class="skip-link" href="#screen">Skip to content</a>

  <div class="app">
    <header class="appbar" id="appbar">
      <button class="ab-back" id="ab-back" type="button" aria-label="Go back">‹</button>
      <span class="ab-brand-dot" aria-hidden="true"></span>
      <h1 class="ab-title" id="ab-title">Annecy 2026</h1>
      <a class="ab-action" id="ab-action" href="#/ideas" aria-label="Saved plans" hidden>★</a>
    </header>

    <main class="screen" id="screen" tabindex="-1"><!-- rendered by app.js --></main>

    <nav class="bottomnav" id="bottomnav" aria-label="Primary">
      <a href="#/today"      data-nav="today"><span class="ico" aria-hidden="true">📍</span>Today</a>
      <a href="#/activities" data-nav="activities"><span class="ico" aria-hidden="true">🧭</span>Activities</a>

      <a href="#/map"        data-nav="map"><span class="ico" aria-hidden="true">🗺️</span>Map</a>

  <div id="offline-bar" class="offline-bar" role="status" hidden>Offline — showing saved trip data.</div>
  <div id="sw-toast" class="sw-toast" role="status" hidden>
    <span>New version available.</span>
    <button type="button" id="sw-reload">Refresh</button>
    <button type="button" id="sw-dismiss" aria-label="Dismiss update notice">✕</button>
  </div>
  <div id="live" class="sr-only" aria-live="polite"></div>

  <script src="data.js?v=14"></script>
  <script src="app.js?v=14"></script>

</html>
